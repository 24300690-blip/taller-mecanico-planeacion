server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  profiles:
    default: dev
  config:
    import: optional:file:../.env[.properties]
  application:
    name: taller-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taller_mecanico?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:taller}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:10}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  recovery-minutes: 20
  recovery-log-link: ${RECOVERY_LOG_LINK:false}
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:Administrador}
  clientes:
    photo-dir: ${CLIENTES_PHOTO_DIR:./data/clientes}
logging:
  level:
    root: INFO
    mx.tallermecanico: INFO
